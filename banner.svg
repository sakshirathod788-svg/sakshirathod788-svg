<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="1000" height="300" role="img" aria-labelledby="bt bd" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="bt">Sakshi Rathod</title>
  <desc id="bd">Computer Science, Web, AI / ML. Web Developer, AI/ML Explorer, Creative Builder, Problem Solver.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" class="g0"/>
      <stop offset="0.45" class="g1"/>
      <stop offset="0.78" class="g2"/>
      <stop offset="1" class="g3"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.32" r="0.55">
      <stop offset="0" class="glow" stop-opacity="0.32"/>
      <stop offset="1" class="glow" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" class="gold" stop-opacity="0"/>
      <stop offset="0.5" class="gold" stop-opacity="1"/>
      <stop offset="1" class="gold" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <style>
    /* ============ EDIT COLOURS HERE (only these lines) ============ */
    .g0   { stop-color: #12070B; }   /* banner left  */
    .g1   { stop-color: #3D0A1D; }   /* banner mid   */
    .g2   { stop-color: #73143E; }   /* banner right */
    .g3   { stop-color: #180A12; }   /* banner edge  */
    .glow { stop-color: #FF6FAE; }   /* soft glow    */
    .gold { stop-color: #E8B86D; }   /* accent line  */
    .ivory{ fill: #F6EBDD; }         /* name         */
    .rose { fill: #FF8FBF; }         /* accent 1     */
    .amber{ fill: #E8B86D; }         /* accent 2     */
    .dim  { fill: #B9899C; }         /* separators   */
    .soft { fill: #EBD7C6; }         /* tagline      */
    /* ================================================================ */

    /* Fonts: SVGs shown inside README can't load web fonts, so use system stacks */
    .name { font: 700 64px Georgia, 'Times New Roman', 'Noto Serif', serif; letter-spacing: 8px; animation: rise 1.2s ease-out both; }
    .sub  { font: 600 26px 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; letter-spacing: 4px; animation: rise 1.2s ease-out 0.25s both; }
    .tag  { font: italic 400 29px Georgia, 'Times New Roman', 'Noto Serif', serif; opacity: 0; animation: cycle 12s ease-in-out infinite; }
    .t2   { animation-delay: 4s; }
    .t3   { animation-delay: 8s; }
    .spark{ animation: twinkle 4s ease-in-out infinite; }
    .s2   { animation-delay: 1.2s; } .s3 { animation-delay: 2.4s; } .s4 { animation-delay: 3.2s; }

    @keyframes rise    { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
    @keyframes cycle   { 0% { opacity: 0; transform: translateY(8px); } 6%, 28% { opacity: 1; transform: none; } 34%, 100% { opacity: 0; transform: translateY(-6px); } }
    @keyframes twinkle { 0%, 100% { opacity: 0.25; } 50% { opacity: 0.95; } }

    @media (prefers-reduced-motion: reduce) {
      .name, .sub, .spark { animation: none; }
      .tag { animation: none; opacity: 0; }
      .t1  { opacity: 1; }
    }
  </style>

  <!-- banner shape with wavy bottom edge (transparent below the wave) -->
  <path d="M0,0 H1000 V262 C875,300 760,232 620,258 C480,284 360,226 230,254 C120,278 50,250 0,262 Z" fill="url(#bg)"/>
  <path d="M0,0 H1000 V262 C875,300 760,232 620,258 C480,284 360,226 230,254 C120,278 50,250 0,262 Z" fill="url(#glow)"/>
  <path d="M1000,246 C875,284 760,216 620,242 C480,268 360,210 230,238 C120,262 50,234 0,246" fill="none" stroke="#E8B86D" stroke-opacity="0.35" stroke-width="1.5"/>

  <!-- sparkles (drawn as paths so they never depend on a font) -->
  <g fill="#E8B86D">
    <path class="spark" transform="translate(-60 0)" d="M170,92 Q170,100 178,100 Q170,100 170,108 Q170,100 162,100 Q170,100 170,92Z"/>
    <path class="spark s2" transform="translate(60 0)" d="M830,70 Q830,84 844,84 Q830,84 830,98 Q830,84 816,84 Q830,84 830,70Z"/>
    <path class="spark s3"   d="M905,170 Q905,177 912,177 Q905,177 905,184 Q905,177 898,177 Q905,177 905,170Z"/>
    <path class="spark s4"   d="M95,190 Q95,197 102,197 Q95,197 95,204 Q95,197 88,197 Q95,197 95,190Z"/>
  </g>

  <!-- name -->
  <text x="504" y="112" text-anchor="middle" class="name ivory">SAKSHI RATHOD</text>
  <rect x="400" y="134" width="200" height="1.5" fill="url(#rule)"/>

  <!-- coloured subtitle (replaces the <font> tags GitHub strips out) -->
  <text x="504" y="176" text-anchor="middle" class="sub">
    <tspan class="rose">COMPUTER SCIENCE</tspan><tspan class="dim" dx="16">•</tspan><tspan class="ivory" dx="16">WEB</tspan><tspan class="dim" dx="16">•</tspan><tspan class="amber" dx="16">AI / ML</tspan>
  </text>

  <!-- rotating tagline (replaces the typing-svg service) -->
  <g class="soft" text-anchor="middle">
    <text x="500" y="222" class="tag t1">Web Developer • AI/ML Explorer</text>
    <text x="500" y="222" class="tag t2">Creative Builder • Problem Solver</text>
    <text x="500" y="222" class="tag t3">Turning Ideas Into Digital Experiences</text>
  </g>
</svg>
